---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
      - python3
      - python3-requests
      - ufw
    state: present


# ============================================================
# Firewall
# ============================================================

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ ansible_port | default(22) }}"
    proto: tcp

- name: Allow VLESS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow Hysteria
  community.general.ufw:
    rule: allow
    port: "21123"
    proto: udp

- name: Allow Trojan
  community.general.ufw:
    rule: allow
    port: "21124"
    proto: tcp

- name: Allow node API from primary only
  community.general.ufw:
    rule: allow
    from_ip: "{{ xui_primary_ip }}"
    to_port: "{{ xui_node_api_port }}"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
